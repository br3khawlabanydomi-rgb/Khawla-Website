<!-- name=components/gallery-section.html
     Add this where you want the hero + gallery. Update image paths to your files (e.g. /agents/photo1.jpg). -->
<section id="hero-gallery">

  <!-- HERO / FULLSCREEN CAROUSEL -->
  <div class="hero">
    <div class="swiper-container">
      <div class="swiper-wrapper">
        <!-- Replace with your images -->
        <div class="swiper-slide">
          <img src="/agents/photo1.jpg" alt="Main highlight" loading="lazy" />
          <div class="hero-overlay">
            <h1>Your Headline Here</h1>
            <p>Short tagline that sells the experience.</p>
            <a class="btn" href="#gallery">Explore the Gallery</a>
          </div>
        </div>
        <div class="swiper-slide">
          <img src="/agents/photo2.jpg" alt="Highlight 2" loading="lazy" />
          <div class="hero-overlay">
            <h1>Another Headline</h1>
            <p>Emotion-driven subtext.</p>
          </div>
        </div>
        <!-- Add more slides as needed -->
      </div>
      <!-- controls -->
      <div class="swiper-pagination"></div>
      <div class="swiper-button-prev" aria-label="Previous slide"></div>
      <div class="swiper-button-next" aria-label="Next slide"></div>
    </div>
  </div>

  <!-- GALLERY GRID -->
  <div id="gallery" class="gallery-grid">
    <!-- Each item should have data-full pointing to the large image -->
    <figure class="gallery-item">
      <img src="/agents/photo1-thumb.jpg" data-full="/agents/photo1.jpg" alt="Photo 1" loading="lazy" />
      <figcaption>Caption for photo 1</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="/agents/photo2-thumb.jpg" data-full="/agents/photo2.jpg" alt="Photo 2" loading="lazy" />
      <figcaption>Caption for photo 2</figcaption>
    </figure>
    <!-- repeat for all photos -->
  </div>

  <!-- LIGHTBOX / MODAL -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-prev" aria-label="Previous">‹</button>
    <img class="lightbox-image" src="" alt="" />
    <button class="lightbox-next" aria-label="Next">›</button>
    <div class="lightbox-caption"></div>
  </div>

</section>

<!-- Add Swiper CDN (or install locally) -->
<link rel="stylesheet" href="https://unpkg.com/swiper@9/swiper-bundle.min.css" />
<script src="https://unpkg.com/swiper@9/swiper-bundle.min.js"></script>
<script src="/assets/js/gallery.js"></script>
<link rel="stylesheet" href="/assets/css/gallery.css" />
