<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101331">
  <meta name="description" content="Khawla Banydomi — AI Lead, ICT Educator">
  <title>Khawla Banydomi</title>
  <style>
    :root{--bg:#0d1027;--panel:#171b3a;--text:#f5f6ff;--muted:#a9aecb;--cyan:#54e5e0;--pink:#ff76bd;--purple:#9b8cff;--gold:#ffd37c;--line:#ffffff1c;--display:'Space Grotesk',sans-serif;--body:'DM Sans',sans-serif}
    html,body{height:100%;margin:0;font-family:var(--body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
    .section{padding:48px 8%;}
    .kicker{color:var(--muted);letter-spacing:1px;font-weight:700}
    .sectionhead h2{margin:10px 0 24px;font-size:28px;line-height:1.05}
    /* Gallery styles */
    .gallery{padding-top:30px}
    .gallerygrid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px}
    .gallerycard{position:relative;overflow:hidden;border-radius:10px;border:1px solid #ffffff12;background:linear-gradient(180deg,#0f1530 0%,#0b0f26 100%);min-height:180px;display:flex;align-items:center;justify-content:center}
    .gallerycard img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;transition:transform .4s ease}
    .gallerycard:hover img{transform:scale(1.06)}
    .gallerycard .caption{position:absolute;left:12px;bottom:12px;background:#00000060;padding:8px 12px;border-radius:8px;color:var(--text);font-weight:600}
    @media(max-width:900px){.gallerygrid{grid-template-columns:1fr 1fr}}
    @media(max-width:480px){.gallerygrid{grid-template-columns:1fr}}
    /* Lightbox */
    .lightbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.75);z-index:999}
    .lightbox.open{display:flex}
    .lightbox img{max-width:92%;max-height:92%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,0.6)}
    .close-x{position:absolute;right:24px;top:18px;color:#fff;font-size:28px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <!-- other sections omitted for brevity; we only enhance the gallery section here -->
    <section class="section gallery" id="gallery">
      <div class="kicker">05 / THE FUTURE OF LEARNING</div>
      <div class="sectionhead"><h2>Where imagination<br><span class="grad">meets intelligence</span></h2></div>

      <!-- Enhanced gallery: use screenshots from repository to make the page richer -->
      <div class="gallerygrid">
        <figure class="gallerycard" data-src="Screenshot 2026-10-16 153900.png">
          <img src="Screenshot 2026-10-16 153900.png" alt="Classroom AI demo">
          <figcaption class="caption">AI in the classroom</figcaption>
        </figure>

        <figure class="gallerycard" data-src="Screenshot 2026-10-16 153944.png">
          <img src="Screenshot 2026-10-16 153944.png" alt="Student dashboard">
          <figcaption class="caption">Student dashboard & analytics</figcaption>
        </figure>

        <figure class="gallerycard" data-src="Screenshot 2026-10-16 153837.png">
          <img src="Screenshot 2026-10-16 153837.png" alt="Teacher toolkit">
          <figcaption class="caption">Teacher toolkit and resources</figcaption>
        </figure>

        <figure class="gallerycard" data-src="Screenshot 2026-10-16 153825.png">
          <img src="Screenshot 2026-10-16 153825.png" alt="Interactive lesson example">
          <figcaption class="caption">Interactive lessons</figcaption>
        </figure>

        <figure class="gallerycard" data-src="Screenshot 2026-10-16 153806.png">
          <img src="Screenshot 2026-10-16 153806.png" alt="AI project showcase">
          <figcaption class="caption">Project showcase</figcaption>
        </figure>

        <figure class="gallerycard" data-src="Screenshot 2026-10-16 153739.png">
          <img src="Screenshot 2026-10-16 153739.png" alt="Workshop highlights">
          <figcaption class="caption">Workshop highlights</figcaption>
        </figure>

        <figure class="gallerycard" data-src="Screenshot 2026-10-16 151623.png">
          <img src="Screenshot 2026-10-16 151623.png" alt="Profile and credentials">
          <figcaption class="caption">Profile & achievements</figcaption>
        </figure>

        <figure class="gallerycard" data-src="Screenshot 2026-10-16 153923.png">
          <img src="Screenshot 2026-10-16 153923.png" alt="Learning outcomes">
          <figcaption class="caption">Learning outcomes & metrics</figcaption>
        </figure>
      </div>

      <p style="margin-top:18px;color:var(--muted)">Click any image to view larger.</p>
    </section>

  </main>

  <!-- Simple lightbox (uses existing IDs if present) -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
    <span class="close-x" onclick="closeLightbox(event)">&times;</span>
    <img id="lightboxImage" src="" alt="">
  </div>

  <script>
    // Lightbox wiring for gallerycards
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    document.querySelectorAll('.gallerycard').forEach(card=>{
      card.addEventListener('click', (e)=>{
        const src = card.getAttribute('data-src') || card.querySelector('img')?.src;
        if(!src) return;
        lightboxImage.src = src;
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      });
    });
    function closeLightbox(e){
      // prevent closing when clicking the image itself
      if(e.target.id === 'lightboxImage') return;
      lightbox.classList.remove('open');
      lightboxImage.src='';
      document.body.style.overflow = '';
    }

    // Accessibility: close on Esc
    document.addEventListener('keydown', e=>{ if(e.key === 'Escape'){ lightbox.classList.remove('open'); lightboxImage.src=''; document.body.style.overflow = ''; } });
  </script>
</body>
</html>
